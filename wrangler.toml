name = "ohi_int"
compatibility_date = "2026-01-01"
pages_output_dir = "./dist"

# Local D1 (created via `wrangler d1 create blue-logistics --local`)
# Run `npx wrangler d1 execute blue-logistics --local --file=functions/db/schema.sql`
# after the first `wrangler d1 create blue-logistics --local` to bootstrap the table.
[[d1_databases]]
binding = "DB"
database_name = "Ohi-international"
database_id = "Ohi-international"

[vars]
SITE_TITLE = "OHI International"
